<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Généalogie</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; }
  #login { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000; background: rgba(0, 0, 0, 0.35); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #login input, #login select { font-size: 16px; } /* 16px stops iOS zooming on focus */
  #map { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  #ruler { position: fixed; left: 0; bottom: 0; width: 100%; height: 80px; background: white; }
  #wheel { position: fixed; left: 0; right: 0; bottom: 0; height: 80px; overflow-x: scroll; scrollbar-width: none; touch-action: pan-x; user-select: none; cursor: grab; }
  #wheel::-webkit-scrollbar { display: none; }
  #track { height: 1px; }
  #range { position: fixed; left: calc(50% - 30px); bottom: 0; width: 60px; height: 80px; box-sizing: border-box; border: 2px solid #333; border-top: 0; pointer-events: none; } /* the years under it are the ones shown */
  #needle { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); min-width: 60px; padding: 2px 6px; box-sizing: border-box; text-align: center; white-space: nowrap; border-radius: 8px; background: #333; color: white; font: bold 15px system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; pointer-events: none; }
  /* tree: the timeline is a strip on the left, years going down, the range open towards the map */
  body.tree #ruler { top: 0; width: 80px; height: 100%; }
  body.tree #wheel { top: 0; right: auto; width: 80px; height: auto; overflow-x: hidden; overflow-y: scroll; touch-action: pan-y; }
  body.tree #range { left: 0; top: calc(50% - 30px); bottom: auto; width: 80px; height: 60px; border-top: 2px solid #333; border-right: 0; }
  body.tree #needle { left: 84px; top: 50%; bottom: auto; transform: translateY(-50%); }
  body.tree #card { left: 90px; bottom: 10px; width: min(340px, calc(100% - 100px)); }
  body.gens #ruler, body.gens #wheel, body.gens #range, body.gens #needle { display: none; } /* tree by generation: no years to show */
  body.gens #card { left: 10px; width: min(340px, calc(100% - 20px)); }
  #card[hidden] { display: none; }
  #card { display: grid; position: fixed; left: 10px; bottom: 90px; width: min(340px, calc(100% - 20px)); z-index: 1000; font: 16px system-ui, -apple-system, sans-serif; }
  #summary { position: relative; padding: 8px 10px; border-radius: 12px; background: white; box-shadow: 0 1px 6px #0003; }
  #card.wed #summary { border-top: 1px solid #eee; border-top-left-radius: 0; border-top-right-radius: 0; } /* spouses' block sits on the card, 💍 on the seam */
  .line { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .sex { flex: 0 0 22px; height: 22px; box-sizing: border-box; border: 2px solid gray; border-radius: 999px; display: grid; place-items: center; font-size: 14px; line-height: 1; color: gray; }
  .sex.M { border-color: #2f6fd6; color: #2f6fd6; }
  .sex.F { border-color: #e0457b; color: #e0457b; }
  .line .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .line .years { color: #666; font-variant-numeric: tabular-nums; cursor: pointer; }
  .buttons { display: flex; gap: 6px; margin-top: 6px; }
  .buttons button { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 999px; background: #eee; color: #333; font-size: 18px; }
  .buttons button.on { background: #c9d8f2; }
  .buttons .info { flex: 1; align-self: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555; font-size: 14px; }
  .buttons[hidden] { display: none; }
  #more { position: fixed; top: 10px; right: 10px; z-index: 2001; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #more button { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 999px; background: #eee; color: #333; font-size: 18px; }
  #more button.on { background: #c9d8f2; }
  #help, #treeToggle { position: fixed; top: 10px; right: 52px; z-index: 1000; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 999px; background: #eee; color: #333; font: bold 18px system-ui, -apple-system, sans-serif; }
  #treeToggle { right: 94px; display: grid; place-items: center; }
  #treeToggle[hidden] { display: none; }
  #legend { position: fixed; top: 54px; right: 10px; z-index: 1000; width: min(300px, calc(100% - 20px)); max-height: calc(100% - 160px); overflow-y: auto; box-sizing: border-box; padding: 6px 12px; border-radius: 12px; background: white; box-shadow: 0 1px 6px #0003; font: 14px system-ui, -apple-system, sans-serif; }
  #legend p { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  #legend p > :first-child { flex: 0 0 34px; display: grid; place-items: center; }
  #more button.option { display: flex; align-items: center; gap: 8px; width: auto; padding: 0 9px 0 14px; font: 15px system-ui, -apple-system, sans-serif; }
  #relatives { max-height: 80vh; overflow: hidden; margin-left: -10px; padding-left: 10px; transition: opacity 0.3s; } /* room on the left for the stamps */
  #relatives.collapsed { opacity: 0; pointer-events: none; }
  #relatives, #panel { grid-area: 1 / 1; align-self: end; } /* same cell: the details unroll over the relatives, which stay put behind */
  .row { padding: 6px 10px; background: white; cursor: pointer; }
  .group { position: relative; margin-bottom: 4px; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px #0002; } /* parents, spouses, or one child: lines joined into one block */
  .group .row + .row { border-top: 1px solid #eee; }
  .stamp-wrap { position: relative; }
  .stamp-wrap.wed .group { margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .stamp { position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 999px; background: white; box-shadow: 0 1px 3px #0003; font-size: 13px; pointer-events: none; } /* relation emoji, on the left edge, across the seam */
  .ghost { position: fixed; z-index: 2000; margin: 0; box-sizing: border-box; }
  .appear { animation: appear 0.3s; }
  @keyframes appear { from { opacity: 0; } }
  #panel { position: relative; max-height: 0; overflow-y: auto; padding: 0 12px; border-radius: 12px; background: white; transition: max-height 0.3s; }
  #panel.open { max-height: 50vh; margin-bottom: 4px; box-shadow: 0 1px 6px #0003; } /* details unroll upward from the person card */
  #panel b { display: block; font-size: 13px; color: #888; font-weight: normal; }
  #panel a { display: inline-block; margin: 3px 2px 0 0; padding: 3px 10px; border-radius: 999px; text-decoration: none; }
  #panel a.M { background: #e3ecfb; color: #1a4fa0; }
  #panel a.F { background: #fbe3ee; color: #a01a5a; }
  #panel a.date { background: #fdf0dc; color: #8a5200; }
  #panel a.place { background: #e2f4e6; color: #1d6b34; }
</style>
</head>
<body>
<form id="login">
  <select name="file">
    <option>fraise.enc</option>
    <option>BEAUVALLET.enc</option>
    <option>beauvallet 4 (1).enc</option>
    <option value="dossmann  .enc">dossmann  .enc</option>
    <option>dossmann complet.enc</option>
    <option>mailly.enc</option>
  </select>
  <input name="pw" type="password" placeholder="Mot de passe">
  <button>Entrer</button>
  <span id="err"></span>
</form>
<div id="map"></div>
<canvas id="ruler"></canvas>
<div id="wheel"><div id="track"></div></div>
<div id="range"></div>
<div id="needle"></div>
<div id="more"></div>
<button id="treeToggle" onclick="toggleTree()" hidden></button>
<button id="help" onclick="toggleLegend()">?</button>
<div id="legend" hidden></div>
<div id="card" hidden>
  <div id="relatives"></div>
  <div id="panel"></div>
  <div id="summary"></div>
</div>
<script>
let people = [], byId = {}, min = 0, selected = null
let ppy = 5, first = 0, last = new Date().getFullYear() // timeline: pixels per year (dragging up/down changes it), first and last year
let from = 0, to = 0 // years under the 60px range in the middle: people alive at any point in them are shown
let counts = [] // people alive each year, drawn behind the timeline
let ancestors = true // 🌳: with someone selected, their ancestors are on the map whatever the years (gray outside them)
let lineage = null // those people (outside the range faded), or null
let everyone = true // 👥: people outside the years are on the map too, in light gray
let links = false // 🔗: parent–child and union lines on the map
let shown = [] // people on the map
const inRange = p => p.from <= to && from <= p.to
let tree = false // tree button: the map shows the full tree instead of the world, on a blank background
let byYear = false // 📅: in the tree, each person at their own birth year, with the timeline beside it; otherwise one row per generation
const spot = p => tree ? (byYear ? p.yearNode : p.genNode) : p.place // [lat, lon] on the current view
const synced = () => tree && byYear // the tree moves with the timeline

// MapLibre map on OpenFreeMap (free, no account), keeping only nature, water, town names and borders: no roads, rails or buildings
let map = null, mapReady = false, baseLayers = []
fetch("https://tiles.openfreemap.org/styles/liberty").then(r => r.json()).then(style => {
  style.layers = style.layers.filter(l => /^(background|natural_earth|landcover|landuse_residential|water|label_village|label_town|label_city|label_other|boundary_2|boundary_3)/.test(l.id))
  baseLayers = style.layers.map(l => l.id).filter(id => id != "background") // hidden in the tree
  map = new maplibregl.Map({ container: "map", style, center: [2.5, 46.5], zoom: 5, maxZoom: 18 })
  map.on("load", () => {
    const empty = { type: "FeatureCollection", features: [] }
    map.addSource("lines", { type: "geojson", data: empty })
    map.addSource("people", { type: "geojson", data: empty })
    map.addSource("counts", { type: "geojson", data: empty })
    map.addSource("trail", { type: "geojson", data: empty })
    map.addSource("dim", { type: "geojson", data: empty })
    addIcons()
    const icons = { "icon-image": ["get", "icon"], "icon-allow-overlap": true, "icon-ignore-placement": true }
    map.addLayer({ id: "lines", type: "line", source: "lines", paint: { "line-color": ["match", ["get", "kind"], "union", "red", "gray"], "line-width": 1, "line-opacity": ["case", ["get", "dim"], 0.3, 1] } })
    map.addLayer({ id: "dim", type: "symbol", source: "dim", layout: icons })
    map.addLayer({ id: "root", type: "circle", source: "trail", filter: ["==", ["get", "kind"], "root"], paint: { "circle-color": "#c9d8f2", "circle-radius": 18 } })
    map.addLayer({ id: "trail-line", type: "line", source: "trail", filter: ["==", ["get", "kind"], "path"], paint: { "line-color": "black", "line-width": 2, "line-dasharray": [3, 3] } })
    map.addLayer({ id: "people", type: "symbol", source: "people", layout: icons })
    // names under the figures, in the tree only
    map.addLayer({ id: "names", type: "symbol", source: "people", paint: { "text-halo-color": "white", "text-halo-width": 2 },
      layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 12, "text-anchor": "top", "text-offset": [0, 1.2], "text-max-width": 7, visibility: "none" } })
    map.on("move", followMap)
    map.addLayer({ id: "trail-stops", type: "circle", source: "trail", filter: ["==", ["get", "kind"], "stop"],
      paint: { "circle-color": "white", "circle-radius": 2, "circle-stroke-color": "black", "circle-stroke-width": 2 } })
    map.addLayer({ id: "trail-labels", type: "symbol", source: "trail", filter: ["==", ["get", "kind"], "stop"],
      layout: { "text-field": ["get", "label"], "text-font": ["Noto Sans Regular"], "text-size": 13, "text-anchor": "left", "text-offset": [1, 0], "text-allow-overlap": true },
      paint: { "text-halo-color": "white", "text-halo-width": 2 } })
    map.addLayer({ id: "selected", type: "circle", source: "trail", filter: ["==", ["get", "kind"], "selected"],
      paint: { "circle-opacity": 0, "circle-radius": 17, "circle-stroke-color": "black", "circle-stroke-width": 3 } })
    map.addLayer({ id: "counts", type: "symbol", source: "counts",
      layout: { "text-field": ["get", "n"], "text-font": ["Noto Sans Bold"], "text-size": 15, "text-allow-overlap": true, "text-ignore-placement": true },
      paint: { "text-halo-color": "white", "text-halo-width": 2 } })
    map.on("click", "people", e => pickOnMap(byId[e.features[0].properties.id]))
    map.on("click", "dim", e => pickOnMap(byId[e.features[0].properties.id]))
    // count click: zoom until the zone's people fill the screen
    map.on("click", "counts", e => {
      const bounds = new maplibregl.LngLatBounds()
      for (const p of levels[shownZoom][e.features[0].properties.i].members) bounds.extend(p.ll)
      map.fitBounds(bounds, { padding: 80, maxZoom: 17 })
    })
    map.on("zoom", () => {
      place()
      if (shownZoom != level()) drawCounts()
    })
    mapReady = true
    draw()
  })
})

document.getElementById("login").onsubmit = async e => {
  e.preventDefault()
  const file = e.target.file.value
  const data = new Uint8Array(await (await fetch(file, { cache: "no-store" })).arrayBuffer())
  console.log(file, "loaded", data.length, "bytes")
  const pw = await crypto.subtle.importKey("raw", new TextEncoder().encode(e.target.pw.value), "PBKDF2", false, ["deriveKey"])
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: data.slice(0, 16), iterations: 200000, hash: "SHA-256" }, pw, { name: "AES-GCM", length: 256 }, false, ["decrypt"])
  const json = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(16, 28) }, key, data.slice(28)).catch(() => null)
  console.log("decrypt", json ? "ok" : "failed")
  if (!json) return document.getElementById("err").textContent = "Mot de passe incorrect"
  document.getElementById("login").remove()
  start(JSON.parse(new TextDecoder().decode(json)))
  drawMenu()
}

function start(list) {
  people = list
  for (const p of people) {
    byId[p.id] = p
    p.children = []
    p.from = p.birth && p.birth.year
    p.to = (p.death && p.death.year) || p.from + 80
    const place = [p.birth, p.death].find(e => e && e.lat != null)
    if (place) p.place = [place.lat, place.lon]
  }
  for (const p of people) {
    if (byId[p.father]) byId[p.father].children.push(p.id)
    if (byId[p.mother]) byId[p.mother].children.push(p.id)
    // no known place: on the map at their first spouse's own place, the card still says "Lieu inconnu"
    const spouse = p.unions.map(u => byId[u.spouse]).find(s => s && s.place && !s.atSpouse)
    if (!p.place && spouse) {
      p.place = spouse.place
      p.atSpouse = true
    }
  }

  treeYears()
  min = Math.min(...people.filter(p => p.from).map(p => p.from))
  console.log(people.length, "people,", people.filter(p => p.from).length, "with birth year,", people.filter(p => p.place).length, "with place, first year", min)
  buildWheel()
  counts = []
  for (let y = first; y <= last; y++) counts.push(people.filter(p => p.from <= y && y <= p.to).length)
  // mouse wheel scrolls the years; dragging left/right scrolls (mouse), dragging up/down zooms (mouse and touch)
  wheel.addEventListener("wheel", e => { e.preventDefault(); flight++; wheel.scrollBy({ [tree ? "top" : "left"]: e.deltaY + e.deltaX, behavior: "smooth" }) }, { passive: false })
  let drag = null, lastMove = 0
  wheel.onpointerdown = e => { flight++; drag ={ x: e.clientX, y: e.clientY, ppy, center: center(), mouse: e.pointerType == "mouse" } }
  window.onpointermove = e => {
    if (!drag) return
    // zoomed all the way out, the whole timeline fits under the range; all the way in, one year fills it
    ppy = Math.min(60, Math.max(60 / (last - first), drag.ppy * Math.pow(2, (tree ? e.clientX - drag.x : drag.y - e.clientY) / 40)))
    sizeTrack()
    scrollWheel((drag.center - first) * ppy - (drag.mouse ? (tree ? e.clientY - drag.y : e.clientX - drag.x) : 0))
    lastMove = tree ? e.movementY : e.movementX
  }
  window.onpointerup = window.onpointercancel = () => {
    if (drag && drag.mouse) wheel.scrollBy({ [tree ? "top" : "left"]: -lastMove * 15, behavior: "smooth" }) // inertia: keep going a bit in the drag direction
    drag = null
  }
  setYear(last)
}

// tree of one person (the root): their ancestors, everyone descending from those (so their own descendants, brothers and sisters,
// nephews, cousins…), and the husbands and wives of all of them.
// Laid out down in generations (or birth years, 📅) and across in slots: the root's ancestors first, the father's on the left
// and the mother's on the right, children centred under their parents, each with their spouse next to them, then the children's
// own families. Each generation fills its own slots in order: a person goes where they belong unless their generation already used it.
const YEAR = 0.0002, SLOT = 0.0032, GEN = 30 * YEAR // degrees, near 0,0 where the map is not stretched
let treeRoot = null
function layTree(root) {
  treeRoot = root
  const ancestors = new Set(), blood = new Set()
  const up = p => { if (p && !ancestors.has(p)) { ancestors.add(p); up(byId[p.father]); up(byId[p.mother]) } }
  const down = p => { if (!blood.has(p)) { blood.add(p); for (const id of p.children) down(byId[id]) } }
  up(root)
  for (const p of ancestors) down(p)
  const inTree = new Set(blood)
  for (const p of blood) for (const u of p.unions) if (byId[u.spouse]) inTree.add(byId[u.spouse])
  const list = [...inTree]
  for (const p of people) for (const k of ["laid", "row", "x", "side", "genNode", "yearNode"]) delete p[k]
  // family links inside the tree only
  const parents = p => [byId[p.father], byId[p.mother]].filter(q => inTree.has(q))
  const kidsOf = p => p.children.map(id => byId[id]).filter(q => inTree.has(q))
  const spousesOf = p => p.unions.map(u => byId[u.spouse]).filter(q => inTree.has(q))

  const next = {} // next free slot of each row
  const put = (p, row, x) => {
    p.laid = true
    p.row = row
    p.x = next[row] == null ? x : Math.max(next[row], x)
    next[row] = p.x + 1
  }
  const free = row => next[row] ?? next[row + 1] ?? next[row - 1] ?? 0 // where someone with nothing to go by goes
  // side: 1 for a father, whose brothers and sisters go on his left, -1 for a mother, whose go on her right, so the couple meets
  const person = (p, row, side) => {
    if (p.laid) return
    p.side = side
    const [a, b] = parents(p)
    if (a) family(a, b, row - 1)
    if (!p.laid) put(p, row, free(row))
  }
  // couple a + b (b may be missing) in row: a, then b with their ancestors, then their children below
  const family = (a, b, row) => {
    person(a, row, 1)
    row = a.row // a may already be in the tree, a generation of their own
    if (b && !b.laid) {
      if (parents(b).length) person(b, row, -1)
      else put(b, row, a.x + 1)
    }
    const key = [a, b].filter(q => q).map(q => q.id).sort().join()
    const kids = [...new Set([a, b].filter(q => q).flatMap(kidsOf))]
      .filter(k => !k.laid && parents(k).map(q => q.id).sort().join() == key)
      .sort((k, l) => (k.side || 0) - (l.side || 0) || (k.from || 9999) - (l.from || 9999))
    const lone = k => spousesOf(k).filter(s => !s.laid && !parents(s).length) // spouses who come with no family
    const width = kids.reduce((n, k) => n + 1 + lone(k).length, 0)
    let x = (b ? (a.x + b.x) / 2 : a.x) - (width - 1) / 2
    for (const k of kids) {
      put(k, row + 1, x)
      x = k.x + 1
      for (const s of lone(k)) {
        put(s, row + 1, x)
        x = s.x + 1
      }
    }
    for (const k of kids) {
      for (const s of spousesOf(k)) family(k, s, row + 1)
      family(k, null, row + 1) // children with no other known parent
    }
  }
  // the root, then their own families; then anyone not reached yet (a second spouse, say), in the generation of their spouse,
  // or above their children
  person(root, 0)
  for (const s of spousesOf(root)) family(root, s, root.row)
  family(root, null, root.row)
  const rowOf = p => {
    const spouse = spousesOf(p).find(q => q.laid), child = kidsOf(p).find(q => q.laid)
    return spouse ? spouse.row : child ? child.row - 1 : 0
  }
  for (const p of list) person(p, rowOf(p))
  const rows = {}
  for (const p of list) (rows[p.row] = rows[p.row] || []).push(p)
  const levels = Object.keys(rows).map(Number).sort((a, b) => a - b).map(r => rows[r].sort((p, q) => p.x - q.x))
  // fewer crossings: sweeping down then up, each generation is reordered by where their parents (down) or children (up) stand,
  // a couple moving as one (barycentre method). Kept only if it crosses less
  const crossings = () => {
    let n = 0
    for (const row of levels) {
      const ends = row.flatMap(p => parents(p).map(q => [q.x, p.x]))
      for (let i = 0; i < ends.length; i++) for (let j = i + 1; j < ends.length; j++) if ((ends[i][0] - ends[j][0]) * (ends[i][1] - ends[j][1]) < 0) n++
    }
    return n
  }
  let best = crossings(), kept = list.map(p => p.x)
  for (let sweep = 0; sweep < 24; sweep++) for (const row of sweep % 2 ? levels.slice().reverse() : levels) {
    const units = [], unitOf = new Map()
    for (const p of row) if (!unitOf.has(p)) {
      const unit = [p]
      unitOf.set(p, unit)
      for (let i = 0; i < unit.length; i++) for (const s of spousesOf(unit[i])) {
        if (s.row == p.row && !unitOf.has(s)) { unitOf.set(s, unit); unit.push(s) }
      }
      units.push(unit)
    }
    for (const unit of units) {
      const near = unit.flatMap(p => sweep % 2 ? kidsOf(p) : parents(p))
      unit.key = near.length ? near.reduce((s, q) => s + q.x, 0) / near.length : unit.reduce((s, p) => s + p.x, 0) / unit.length
    }
    units.sort((a, b) => a.key - b.key)
    row.length = 0
    for (const unit of units) row.push(...unit)
    row.forEach((p, i) => p.x = i)
    const n = crossings()
    if (n < best) { best = n; kept = list.map(p => p.x) }
  }
  list.forEach((p, i) => p.x = kept[i])
  for (const row of levels) row.sort((p, q) => p.x - q.x)
  // that packs every generation as tight as it goes, so the widest one, far up, pushes the two sides apart all the way down.
  // So then, keeping each generation's order, sweep up and down moving everyone towards the middle of their children (the
  // childless: of their parents), as close as they can get while staying a slot apart (least squares, by pool-adjacent-violators):
  // each generation only as wide as it needs, so the tree opens up as the generations grow
  const kin = p => { const kids = kidsOf(p).filter(q => q.row > p.row); return kids.length ? kids : parents(p).filter(q => q.row < p.row) }
  for (let sweep = 0; sweep < 60; sweep++) for (const row of sweep % 2 ? levels.slice().reverse() : levels) {
    const blocks = [] // runs of people pushed against each other: x = their shared offset + their index
    row.forEach((p, i) => {
      const k = kin(p)
      blocks.push({ sum: (k.length ? k.reduce((s, q) => s + q.x, 0) / k.length : p.x) - i, n: 1 })
      while (blocks.length > 1 && blocks.at(-2).sum / blocks.at(-2).n > blocks.at(-1).sum / blocks.at(-1).n) {
        const b = blocks.pop()
        blocks.at(-1).sum += b.sum
        blocks.at(-1).n += b.n
      }
    })
    let i = 0
    for (const b of blocks) for (let k = 0; k < b.n; k++, i++) row[i].x = b.sum / b.n + i
  }
  for (const p of list) {
    p.genNode = [-p.row * GEN, p.x * SLOT]
    if (p.treeYear != null) p.yearNode = [-p.treeYear * YEAR, p.x * SLOT]
  }
}

// no birth year, for the tree by year: their spouse's, 30 years before a dated child's, or 30 after a dated parent's; with none of these, left out
function treeYears() {
  for (const p of people) p.treeYear = p.from
  for (let pass = 0; pass < 5; pass++) for (const p of people) if (p.treeYear == null) {
    const spouse = p.unions.map(u => byId[u.spouse]).find(q => q && q.treeYear != null)
    const child = p.children.map(id => byId[id]).find(q => q.treeYear != null)
    const parent = [byId[p.father], byId[p.mother]].find(q => q && q.treeYear != null)
    p.treeYear = spouse ? spouse.treeYear : child ? child.treeYear - 30 : parent ? parent.treeYear + 30 : null
  }
}

// card's tree button: the tree of the selected person (from the map, or another tree)
function showTree(p) {
  layTree(p)
  switchView(() => tree = true)
  select(p)
}

// tree buttons and 📅: switch views (world map, tree by generation, tree by year); the selected person is centred in the new one,
// otherwise each comes back where it was left. The top button is there in the tree only, back to the map
let views = {}
const view = () => !tree ? "map" : byYear ? "years" : "gens"
function toggleTree() {
  switchView(() => tree = !tree)
}
function switchView(change) {
  if (!mapReady || !people.length) return change()
  views[view()] = { center: map.getCenter(), zoom: map.getZoom() }
  const year = center()
  change()
  const now = view()
  treeToggle.hidden = !tree
  document.body.classList.toggle("tree", tree)
  document.body.classList.toggle("gens", now == "gens")
  sizeTrack()
  scrollWheel((year - first) * ppy)
  drawRuler()
  for (const id of baseLayers) map.setLayoutProperty(id, "visibility", tree ? "none" : "visible")
  map.setLayoutProperty("names", "visibility", tree ? "visible" : "none")
  syncing = true // the zoom limits can move the map: not the timeline's business
  map.setMinZoom(now == "years" ? zoomOf(60 / (last - first)) : null)
  map.setMaxZoom(now == "years" ? zoomOf(60) : 18)
  syncing = false
  const s = (selected && spot(selected)) || (tree && !views[now] && spot(treeRoot))
  if (now == "years") {
    if (s) {
      flight++
      scrollWheel((-s[0] / YEAR - first) * ppy)
    }
    syncMap(s ? s[1] : views.years ? views.years.center.lng : treeRoot.genNode[1])
  }
  else if (s) map.jumpTo({ center: [s[1], s[0]], zoom: views[now] ? views[now].zoom : 14 })
  else map.jumpTo(views[now])
  draw()
}

// in the tree, the map's down is the timeline: the same year in the middle, the same pixels per year, either way round
const zoomOf = ppy => Math.log2(ppy / YEAR * 360 / 512)
let syncing = false
function syncMap(lng = map.getCenter().lng) {
  const c = map.getCenter(), lat = -center() * YEAR, zoom = zoomOf(ppy)
  if (Math.abs(c.lat - lat) / YEAR * ppy < 0.5 && Math.abs(map.getZoom() - zoom) < 0.001 && c.lng == lng) return
  syncing = true
  map.jumpTo({ center: [lng, lat], zoom })
  syncing = false
}
function followMap() {
  if (!synced() || syncing) return
  flight++
  ppy = YEAR * 512 * 2 ** map.getZoom() / 360
  sizeTrack()
  scrollWheel((-map.getCenter().lat / YEAR - first) * ppy)
  drawRuler()
}

function buildWheel() {
  first = Math.floor(min / 10) * 10
  sizeTrack()
}

wheel.onscroll = () => {
  drawRuler()
  if (synced()) syncMap()
  const half = Math.floor(30 / ppy), y = Math.round(center())
  if (from != y - half || to != y + half) draw()
}
window.onresize = () => {
  buildWheel()
  drawRuler()
}

// the timeline runs across at the bottom, or down on the left in the tree
const along = el => tree ? el.clientHeight : el.clientWidth
const scrolled = () => tree ? wheel.scrollTop : wheel.scrollLeft
const scrollWheel = v => tree ? wheel.scrollTop = v : wheel.scrollLeft = v
function sizeTrack() {
  const length = (last - first) * ppy + along(wheel) + "px" // half a screen of padding on each side, so every year can reach the middle
  track.style.width = tree ? "1px" : length
  track.style.height = tree ? length : "1px"
}

// year in the middle of the timeline (not rounded)
function center() {
  return first + scrolled() / ppy
}

function setYear(y) {
  scrollWheel((y - first) * ppy)
  drawRuler()
  draw()
}

// timeline: alive count as gray bars, and year lines with their numbers, as far apart as the zoom allows
function drawRuler() {
  const dpr = devicePixelRatio, w = along(ruler), h = tree ? ruler.clientWidth : ruler.clientHeight // w along, h across from the map's side
  ruler.width = ruler.clientWidth * dpr
  ruler.height = ruler.clientHeight * dpr
  const ctx = ruler.getContext("2d")
  if (tree) ctx.setTransform(0, dpr, -dpr, 0, h * dpr, 0) // across goes right to left, so the map's side is on the right
  else ctx.scale(dpr, dpr)
  const left = center() - w / 2 / ppy, x = y => (y - left) * ppy
  const max = Math.max(1, ...counts)
  ctx.fillStyle = "#f0f0f0" // grayed: before the first birth and after this year
  ctx.fillRect(0, 0, x(first), h)
  ctx.fillRect(x(last + 1), 0, w, h)
  ctx.fillStyle = "#e4e4e4"
  counts.forEach((n, i) => {
    const bar = n / max * (h - 30)
    ctx.fillRect(x(first + i), h - bar, Math.max(1, ppy), bar)
  })
  // scales: a thick line every s years, and 4 thin ones splitting each gap in 5 (when that falls on whole years). A scale shows
  // once its thick lines are 70px apart, and gives way as the next finer one comes in (its lines going from 50 to 70px apart),
  // so lines and numbers cross-fade from one scale to the next; lines both scales share stay. Only two widths, on whole pixels.
  const steps = [1, 5, 10, 50, 100, 500, 1000, 5000]
  const smooth = v => (v = Math.min(1, Math.max(0, v))) * v * (3 - 2 * v)
  const on = s => smooth((s * ppy - 50) / 20)
  const scales = steps.map((s, i) => ({ s, w: on(s) * (1 - (i ? on(steps[i - 1]) : 0)) })).filter(k => k.w > 0.01)
  const fine = Math.min(...scales.map(k => k.s % 5 ? k.s : k.s / 5))
  const labels = []
  for (let y = Math.ceil((left - 30 / ppy) / fine) * fine; x(y) < w + 30; y += fine) {
    let thick = 0, thin = 0
    for (const k of scales) {
      if (y % k.s == 0) thick += k.w
      if (k.s % 5 == 0 && y % (k.s / 5) == 0) thin += k.w
    }
    thick = Math.min(1, thick)
    thin = Math.min(1, thin) - thick
    const X = Math.round(x(y))
    if (thin > 0) {
      ctx.fillStyle = `rgba(0, 0, 0, ${0.1 * thin})`
      ctx.fillRect(X, 0, 1, h)
    }
    if (thick > 0) {
      ctx.fillStyle = `rgba(0, 0, 0, ${0.22 * thick})`
      ctx.fillRect(X - 1, 0, 2, h)
      labels.push([y, X, thick])
    }
  }
  // numbers of the thick lines in white pills with a soft gray outline, in the bottom half, fading with their line
  Object.assign(ctx, { font: "bold 13px system-ui, -apple-system, sans-serif", textAlign: "center", textBaseline: "middle", lineWidth: 1, strokeStyle: "#ccc" })
  if (tree) ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  for (const [y, X, alpha] of labels) {
    const pill = Math.ceil(ctx.measureText(y).width) + 14, [cx, cy] = tree ? [h - 51, X] : [X, 51]
    ctx.globalAlpha = alpha
    ctx.beginPath()
    ctx.roundRect(Math.round(cx - pill / 2) + 0.5, Math.round(cy) - 10.5, pill, 20, 8)
    ctx.fillStyle = "white"
    ctx.fill()
    ctx.stroke()
    ctx.fillStyle = "#333"
    ctx.fillText(y, cx, cy)
  }
  ctx.globalAlpha = 1
}

function draw() {
  const half = Math.floor(30 / ppy), y = Math.round(center())
  from = y - half
  to = y + half
  needle.textContent = from == to ? from : from + "–" + to
  lineage = null
  if (ancestors && selected) {
    lineage = new Set()
    const add = p => { if (p) { lineage.add(p); add(byId[p.father]); add(byId[p.mother]) } }
    add(selected)
  }
  shown = people.filter(p => spot(p) && (tree || everyone || (lineage ? lineage.has(p) : inRange(p))))
  if (!mapReady) return

  // people at the same place sit on a small ring (15 m apart), visible once clustering stops
  const groups = {}
  for (const p of shown) {
    groups[spot(p)] = groups[spot(p)] || []
    groups[spot(p)].push(p)
  }
  for (const group of Object.values(groups)) {
    const [lat, lon] = spot(group[0])
    const meters = group.length == 1 ? 0 : group.length * 15 / (2 * Math.PI)
    group.forEach((p, i) => {
      const angle = 2 * Math.PI * i / group.length
      p.ll = [lon + meters * Math.cos(angle) / (111320 * Math.cos(lat * Math.PI / 180)), lat + meters * Math.sin(angle) / 111320] // [lon, lat] like MapLibre
    })
  }
  group(shown.filter(inRange))
  drawCounts()
  place()
}

// icons, lines and the selection ring, redrawn at each zoom step. Groups show as a stack of cards, each 3px right and 3px up
// behind the one before: 1 card for one person, 2 for 2 to 10 people, 3 for more than 10, the others hidden behind the last.
// Each icon leans on its anchor, the nearest icon before it within 12px. Zooming scales every distance alike, so anchors never
// change while they matter, and the pull is a function of the distance alone: none at 12px, full under 4px. So joining and
// leaving follow the zoom exactly; only the card an icon sits on (when a group passes 2 or 10) glides, a third of the way each frame.
// Known jank: setData rebuilds the sources in MapLibre's worker, so while zooming the icons, lines and ring show a frame or more
// late and drift around the fixed place dots. Drawing all of this on our own canvas over the map, on each MapLibre "render",
// would make it exact, at the cost of a rewrite and hand-made click hit-testing.
let placed = new Set(), settling = 0
function place() {
  const scale = 512 * 2 ** map.getZoom(), cells = {}, size = new Map() // cells: icons by 12px square, to only look at the 9 around
  for (const p of shown) {
    const m = maplibregl.MercatorCoordinate.fromLngLat(p.ll), cx = Math.floor(m.x * scale / 12), cy = Math.floor(m.y * scale / 12)
    p.x = m.x * scale // own spot, in screen pixels
    p.y = m.y * scale
    p.anchor = null
    let d = 12
    if (!tree) for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (const q of cells[(cx + i) + "," + (cy + j)] || []) {
      if (Math.hypot(q.x - p.x, q.y - p.y) < d) {
        d = Math.hypot(q.x - p.x, q.y - p.y)
        p.anchor = q
      }
    }
    const t = Math.min(1, Math.max(0, (12 - d) / 8))
    p.pull = t * t * (3 - 2 * t)
    p.root = p.pull > 0.5 ? p.anchor.root : p // front card of their group
    p.rank = size.get(p.root) || 0 // 0 for the front card, then 1, 2… in order of joining
    size.set(p.root, p.rank + 1)
    ;(cells[cx + "," + cy] = cells[cx + "," + cy] || []).push(p)
  }
  let moving = false
  for (const p of shown) {
    const n = size.get(p.root), card = p.rank == 0 ? 0 : p.rank == 1 ? 1 : n <= 10 ? 1 : 2 // 0 front, 1 and 2 behind
    if (!placed.has(p)) p.card = card
    p.card += (card - p.card) / 3
    if (Math.abs(card - p.card) > 0.01) moving = true
    p.sx = p.x // shown spot, in screen pixels
    p.sy = p.y
    if (p.anchor) {
      const a = p.anchor, behind = (p.card - a.card) * 3
      p.sx += (a.sx + behind - p.x) * p.pull
      p.sy += (a.sy - behind - p.y) * p.pull
    }
    const ll = new maplibregl.MercatorCoordinate(p.sx / scale, p.sy / scale).toLngLat()
    p.pos = [ll.lng, ll.lat]
  }
  placed = new Set(shown)
  cancelAnimationFrame(settling)
  settling = moving ? requestAnimationFrame(place) : 0
  // lines join people in the years or in 🌳 (not the light gray ones); a line is faded when either end is outside the years.
  // The tree has no period: all its lines, between everyone, never faded
  const lines = [], dots = [], dim = [], trail = []
  const linked = new Set(tree ? shown : shown.filter(p => inRange(p) || (lineage && lineage.has(p))))
  const out = p => !tree && !inRange(p)
  for (const p of linked) {
    const ps = [byId[p.father], byId[p.mother]].filter(q => linked.has(q))
    if (tree && ps.length) {
      // tree: one straight line from the middle of the parents to the child (bars at a shared height ran into each other)
      const top = [ps.reduce((s, q) => s + q.pos[0], 0) / ps.length, ps.reduce((s, q) => s + q.pos[1], 0) / ps.length]
      lines.push(feature("LineString", [top, p.pos], { kind: "parent", dim: false }))
    }
    else for (const q of ps) if (links) lines.push(feature("LineString", [q.pos, p.pos], { kind: "parent", dim: out(p) || out(q) }))
    for (const u of p.unions) {
      if ((links || tree) && linked.has(byId[u.spouse])) lines.push(feature("LineString", [byId[u.spouse].pos, p.pos], { kind: "union", dim: out(p) || out(byId[u.spouse]) }))
    }
  }
  for (const p of shown) {
    const icon = { M: "man", F: "woman" }[p.sex] || "person"
    if (!out(p)) dots.push(feature("Point", p.pos, { id: p.id, icon, name: p.name }))
    else dim.push(feature("Point", p.pos, { id: p.id, icon: (linked.has(p) ? "gray-" : "light-") + icon }))
  }

  // selected person: black ring, and on the world map their life's places (white circles) joined by a dashed line in date order
  if (selected && !tree) {
    const stops = selected.places.slice().sort((a, b) => (a.year || 9999) - (b.year || 9999))
    trail.push(feature("LineString", stops.map(s => [s.lon, s.lat]), { kind: "path" }))
    const labels = {}
    for (const s of stops) {
      const key = s.lon + "," + s.lat
      const text = (KINDS[s.kind] || s.kind) + (s.year ? " " + s.year : "")
      labels[key] = labels[key] ? labels[key] + ", " + text : text
    }
    for (const key in labels) trail.push(feature("Point", key.split(",").map(Number), { kind: "stop", label: labels[key] }))
  }
  if (selected && shown.includes(selected)) trail.push(feature("Point", selected.pos, { kind: "selected" }))
  if (tree && shown.includes(treeRoot)) trail.push(feature("Point", treeRoot.pos, { kind: "root" }))
  map.getSource("lines").setData({ type: "FeatureCollection", features: lines })
  map.getSource("people").setData({ type: "FeatureCollection", features: dots })
  map.getSource("dim").setData({ type: "FeatureCollection", features: dim })
  map.getSource("trail").setData({ type: "FeatureCollection", features: trail })
}

// zones for the counts: levels[z] holds the zones at zoom z, made by joining the zones of zoom z + 1 closer than 40px; no zones from zoom 16
let levels = [], shownZoom = 0
const level = () => Math.max(0, Math.min(16, Math.floor(map.getZoom())))

function group(list) {
  let prev = list.map(p => {
    p.at = [] // p.at[z]: p's group at zoom z
    const m = maplibregl.MercatorCoordinate.fromLngLat(p.ll)
    return { x: m.x, y: m.y, members: [p] }
  })
  levels = []
  for (let z = 16; z >= 0; z--) {
    if (z < 16) {
      const r = 40 / (512 * 2 ** z), next = []
      for (const g of prev) {
        const near = next.find(n => Math.hypot(n.parts[0].x - g.x, n.parts[0].y - g.y) < r)
        if (near) near.parts.push(g)
        else next.push({ parts: [g] })
      }
      prev = next.map(({ parts }) => {
        if (parts.length == 1) return parts[0]
        const members = parts.flatMap(g => g.members), mean = k => parts.reduce((s, g) => s + g[k] * g.members.length, 0) / members.length
        return { x: mean("x"), y: mean("y"), members }
      })
    }
    levels[z] = prev
    for (const g of prev) for (const p of g.members) p.at[z] = g
  }
}

// number of people over each zone of the current zoom that holds more than one
function drawCounts() {
  shownZoom = level()
  const features = []
  if (!tree) (levels[shownZoom] || []).forEach((g, i) => {
    if (g.members.length < 2) return
    const ll = new maplibregl.MercatorCoordinate(g.x, g.y).toLngLat()
    features.push(feature("Point", [ll.lng, ll.lat], { i, n: g.members.length }))
  })
  map.getSource("counts").setData({ type: "FeatureCollection", features })
}

// bathroom-sign figures with a white outline: blue man, pink woman, black for unknown sex
function addIcons() {
  const s = 1.2 * devicePixelRatio, pad = 1.5
  const make = (name, color, woman) => {
    const c = document.createElement("canvas")
    c.width = Math.ceil((10 + 2 * pad) * s)
    c.height = Math.ceil((22 + 2 * pad) * s)
    const ctx = c.getContext("2d")
    ctx.scale(s, s)
    Object.assign(ctx, { lineWidth: 2.5, lineJoin: "round", strokeStyle: "white", fillStyle: color })
    const path = figure(pad, pad, woman)
    ctx.stroke(path)
    ctx.fill(path)
    map.addImage(name, ctx.getImageData(0, 0, c.width, c.height), { pixelRatio: devicePixelRatio })
  }
  make("man", "#2f6fd6")
  make("woman", "#e0457b", true)
  make("person", "black")
  for (const name of ["man", "woman", "person"]) {
    make("gray-" + name, "gray", name == "woman") // 🌳 ancestors outside the years
    make("light-" + name, "#c8c8c8", name == "woman") // 👥 everyone else outside the years
  }
}

// 10 × 22 figure: head, then shoulders and two legs (man) or a dress and two legs (woman)
function figure(x, y, woman) {
  const p = new Path2D()
  p.arc(x + 5, y + 2.2, 2.2, 0, 2 * Math.PI)
  if (woman) {
    p.moveTo(x + 3, y + 5.4)
    p.lineTo(x + 7, y + 5.4)
    p.lineTo(x + 10, y + 15)
    p.lineTo(x, y + 15)
    p.closePath()
    p.rect(x + 3, y + 15, 1.6, 7)
    p.rect(x + 5.4, y + 15, 1.6, 7)
  } else {
    p.roundRect(x, y + 5.4, 10, 7.6, [2.5, 2.5, 1, 1])
    p.rect(x + 2.5, y + 12, 2.2, 10)
    p.rect(x + 5.3, y + 12, 2.2, 10)
  }
  return p
}

function feature(type, coordinates, properties) {
  return { type: "Feature", geometry: { type, coordinates }, properties }
}

const KINDS = { NAISSANCE: "Naissance", BAPTEME: "Baptême", UNION: "Union", DECES: "Décès", INHUMATION: "Inhumation", PROFESSION: "Profession" }

function link(id) {
  return byId[id] ? `<a href="#" class="${byId[id].sex}" onclick="focusOn('${id}')">${byId[id].name}</a>` : ""
}

// date links move the timeline, place links move the map
function when(e) {
  const date = e.year ? `<a href="#" class="date" onclick="goYear(${e.year})">${e.date || e.year}</a>` : e.date || ""
  const place = e.lat != null ? `<a href="#" class="place" onclick="goPlace(${e.lat}, ${e.lon})">${e.place}</a>` : e.place || ""
  return date + " " + place
}

function goYear(y) {
  travel(y)
}

// from the tree, back to the world map first
function goPlace(lat, lon) {
  if (tree) toggleTree()
  travel(null, [lon, lat])
}

function unselect() {
  selected = null
  card.hidden = true
  panel.classList.remove("open")
  draw()
}

const show = { unions: true, parents: true, children: true } // which relatives are listed under the card
let menuOpen = false // … menu with the toggles, stays open across selections

const svg = inner => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`
const ICONS = {
  more: svg('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),
  up: svg('<polyline points="5 15 12 8 19 15"/>'),
  down: svg('<polyline points="5 9 12 16 19 9"/>'),
  close: svg('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),
  map: svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
  tree: svg('<path d="M12 22v-8M12 17l-3-3M12 15.5l3-2.5"/><path d="M8 16.5a5 5 0 0 1-2.5-8.8 6.5 6.5 0 0 1 13 0 5 5 0 0 1-2.5 8.8"/>'),
}
treeToggle.innerHTML = ICONS.map

// one line: "Prénom NOM…  1750–1802", after ♂/♀ in a ring of the person's sex colour
function line(p) {
  return `<span class="sex ${p.sex}">${{ M: "♂︎", F: "♀︎" }[p.sex] || ""}</span><span class="name">${p.name}</span><span class="years" onclick="event.stopPropagation(); cycleDates()">${lifespan(p)}</span>`
}

function row(id) {
  return byId[id] ? `<div class="row line" onclick="pick(this, '${id}')">${line(byId[id])}</div>` : ""
}

// lines joined into one block, with the relation emoji as a stamp on its left edge, halfway down
// (spouses, with the list showing: no stamp here, the block sits on the person card, which carries 💍 on its top edge)
function block(icon, rows) {
  if (!rows.join("")) return ""
  return icon ? `<div class="stamp-wrap"><div class="group">${rows.join("")}</div><span class="stamp">${icon}</span></div>`
    : `<div class="stamp-wrap wed"><div class="group">${rows.join("")}</div></div>`
}

// map click: person card (bottom) with relatives listed above it; the chevron opens the details
function select(p) {
  selected = p
  card.hidden = false
  const marriages = p.unions.map(u => u.year).filter(y => y)
  const wed = show.unions && p.unions.some(u => byId[u.spouse]) && !panel.classList.contains("open")
  card.classList.toggle("wed", wed)
  summary.innerHTML = (wed ? `<span class="stamp" style="top: 0">💍</span>` : "") + `<div class="line">${line(p)}</div><div class="buttons">`
    + `<span class="info">${p.occupation ? "🛠️ " + p.occupation + " " : ""}${marriages.length ? "💍 " + marriages.join(", ") : ""}</span>`
    + `<button class="${tree && treeRoot == p ? "on" : ""}" onclick="showTree(selected)">${ICONS.tree}</button>`
    + `<button onclick="panel.classList.toggle('open'); select(selected)">${panel.classList.contains("open") ? ICONS.down : ICONS.up}</button>`
    + `<button onclick="unselect()">${ICONS.close}</button></div>`
  drawMenu()
  relatives.innerHTML = (show.children ? p.children.map(id => block("🧒", [row(id)])).join("") : "")
    + (show.parents ? block("👪", [row(p.father), row(p.mother)]) : "")
    + (show.unions ? block(wed ? "" : "💍", p.unions.map(u => row(u.spouse))) : "")
  if (panel.classList.contains("open")) details()
  relatives.classList.toggle("collapsed", panel.classList.contains("open")) // details cover the relatives list, which fades behind them
  draw()
}

// … button, top right: which relatives are listed under the card, and 🌳 ancestors
function drawMenu() {
  more.innerHTML = `<button onclick="menuOpen = !menuOpen; legend.hidden = true; drawMenu()">${ICONS.more}</button>`
    + (menuOpen ? option(show.unions, "unions", "💍", "Afficher les unions")
      + option(show.parents, "parents", "👪", "Afficher les parents")
      + option(show.children, "children", "🧒", "Afficher les enfants")
      + option(ancestors, "ancestors", "🌳", "Afficher les ancêtres")
      + option(everyone, "everyone", "👥", "Afficher tout le monde")
      + option(links, "links", "🔗", "Afficher les liens")
      + option(byYear, "byYear", "📅", "Arbre selon les années") : "")
}

// ? button: what the map and timeline marks mean; it and the … menu close each other
function toggleLegend() {
  legend.hidden = !legend.hidden
  menuOpen = false
  drawMenu()
  const icon = (color, woman) => {
    const c = document.createElement("canvas"), s = 2
    c.width = 13 * s
    c.height = 25 * s
    const ctx = c.getContext("2d")
    ctx.scale(s, s)
    Object.assign(ctx, { lineWidth: 2.5, lineJoin: "round", strokeStyle: "white", fillStyle: color })
    const path = figure(1.5, 1.5, woman)
    ctx.stroke(path)
    ctx.fill(path)
    return `<img src="${c.toDataURL()}" width="13" height="25">`
  }
  const svg = inner => `<svg width="34" height="22" viewBox="0 0 34 22">${inner}</svg>`
  const item = (mark, text) => `<p><span>${mark}</span><span>${text}</span></p>`
  legend.innerHTML = item(icon("#2f6fd6"), "Homme (dans la période)")
    + item(icon("#e0457b", true), "Femme (dans la période)")
    + item(icon("black"), "Sexe inconnu (dans la période)")
    + item(icon("gray"), "Ancêtre (hors période)")
    + item(icon("#c8c8c8"), "Personne (hors période)")
    + item(svg('<line x1="2" y1="11" x2="32" y2="11" stroke="gray" stroke-width="1.5"/>'), "Parent et enfant")
    + item(svg('<line x1="2" y1="11" x2="32" y2="11" stroke="red" stroke-width="1.5"/>'), "Union")
    + item(svg('<circle cx="17" cy="11" r="10" fill="#c9d8f2"/>'), "Personne dont c'est l'arbre")
    + item(svg('<line x1="6" y1="11" x2="28" y2="11" stroke="black" stroke-width="2" stroke-dasharray="3 3"/><circle cx="6" cy="11" r="3" fill="white" stroke="black" stroke-width="2"/><circle cx="28" cy="11" r="3" fill="white" stroke="black" stroke-width="2"/>'), "Lieux de la vie de la personne")
}

// text then icon, so the icons line up on the right under the … button
function option(on, key, icon, text) {
  return `<button class="option ${on ? "on" : ""}" onclick="toggle('${key}')">${text} ${icon}</button>`
}

function refresh() {
  if (selected) select(selected)
  else {
    drawMenu()
    draw()
  }
}

function toggle(key) {
  if (key == "ancestors") ancestors = !ancestors
  else if (key == "everyone") everyone = !everyone
  else if (key == "links") links = !links
  else if (key == "byYear") switchView(() => byYear = !byYear)
  else show[key] = !show[key]
  refresh()
}

// drawer pull, all at once and in step: a copy of the clicked line slides down and grows into the person card; the old list
// (a still copy) slides down with it while fading, as does the new person's list, coming down from above; the old card fades
function pick(el, id) {
  const from = el.getBoundingClientRect(), to = summary.getBoundingClientRect(), shift = to.top - from.top
  const motion = { duration: 300, easing: "ease" }
  const ghost = el.cloneNode(true)
  ghost.className = "row line ghost"
  document.body.append(ghost)
  ghost.animate([
    { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px", borderRadius: 0 },
    { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px", padding: "8px 10px", borderRadius: "12px", boxShadow: "0 1px 6px #0003" },
  ], { ...motion, fill: "forwards" })
  for (const e of [relatives, summary]) {
    const r = e.getBoundingClientRect(), css = getComputedStyle(e), copy = e.cloneNode(true)
    copy.removeAttribute("id") // no duplicate ids, so its #id style is copied by hand
    Object.assign(copy.style, { position: "absolute", left: r.left + "px", top: r.top + "px", width: r.width + "px", boxSizing: "border-box", margin: 0,
      padding: css.padding, background: css.background, borderRadius: css.borderRadius, boxShadow: css.boxShadow })
    if (e == relatives) copy.querySelectorAll(".row")[[...relatives.querySelectorAll(".row")].indexOf(el)].style.visibility = "hidden" // the moving copy replaces it
    // the old list is cut at the card's top edge, so nothing shows below the card as it slides down
    const clip = document.createElement("div")
    Object.assign(clip.style, { position: "fixed", left: 0, right: 0, top: 0, height: (e == relatives ? to.top : innerHeight) + "px", overflow: "hidden", zIndex: 1999, pointerEvents: "none" })
    clip.append(copy)
    document.body.append(clip)
    const down = e == relatives ? shift : 0
    copy.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateY(${down}px)` }], motion).onfinish = () => clip.remove()
  }
  focusOn(id)
  summary.style.visibility = "hidden" // until the moving copy lands on it
  relatives.animate([{ opacity: 0, transform: `translateY(${-shift}px)` }, { opacity: 1, transform: "none" }], motion)
  setTimeout(() => {
    ghost.remove()
    summary.style.visibility = ""
    summary.querySelector(".buttons").classList.add("appear")
  }, 300)
}

// dates display, clicking any date cycles: birth year → birth–death → birth–death (age)
let dateMode = 0
function lifespan(p) {
  const b = p.birth && p.birth.year, d = p.death && p.death.year
  if (dateMode == 0) return b || "?"
  return (b || "?") + "–" + (d || "?") + (dateMode == 2 && b && d ? " (" + (d - b) + " ans)" : "")
}

function cycleDates() {
  dateMode = (dateMode + 1) % 3
  select(selected)
}

// unions and children in date order (undated ones last)
function lifeEvents(p) {
  const events = p.unions.map(u => ({ year: u.year, html: `<p><b>💍 Union</b>${when(u)}<br>${link(u.spouse)}</p>` }))
  for (const id of p.children) {
    const birth = byId[id].birth
    events.push({ year: birth && birth.year, html: `<p><b>🧒 Enfant</b>${birth ? when(birth) + "<br>" : ""}${link(id)}</p>` })
  }
  return events.sort((a, b) => (a.year || 9999) - (b.year || 9999)).map(e => e.html).join("")
}

function details() {
  const p = selected
  panel.innerHTML = (p.occupation ? `<p>🛠️ ${p.occupation}</p>` : "")
    + (p.place && !p.atSpouse ? "" : "<p>Lieu inconnu</p>")
    + (p.father || p.mother ? `<p><b>👪 Parents</b>${link(p.father)} ${link(p.mother)}</p>` : "")
    + (p.birth ? `<p><b>👶 Naissance</b>${when(p.birth)}</p>` : "")
    + lifeEvents(p)
    + (p.death ? `<p><b>✝️ Décès</b>${when(p.death)}</p>` : "")
}

// person link: go to their birth (year, or death year if none, and place)
function focusOn(id) {
  const p = byId[id]
  const s = spot(p)
  travel(p.from || (p.death && p.death.year), s && [s[1], s[0]])
  select(p)
}

// map click: the timeline glides to their birth (death if no birth), at the same timeline zoom; the map stays
function pickOnMap(p) {
  travel(synced() ? p.treeYear : p.from || (p.death && p.death.year), null, true)
  select(p)
}

let flight = 0 // bumped to stop the running timeline animation
const ease = t => t < 0.5 ? 4 * t ** 3 : 1 - (2 - 2 * t) ** 3 / 2

// one motion to year y and place lngLat (either may be missing): the map zooms out and back in (flyTo),
// the timeline does the same in step, zooming out until both years fit (unless keepZoom), so the jump's size shows on both.
// In the tree, the timeline carries the map up or down, and across follows in step
function travel(y, lngLat, keepZoom) {
  if (synced() && lngLat) y = -lngLat[1] / YEAR
  const lng0 = synced() ? map.getCenter().lng : 0, lng1 = synced() && lngLat ? lngLat[0] : lng0
  const w = along(wheel), y0 = center(), dy = y ? Math.abs(y - y0) : 0
  const px = lngLat && mapReady ? map.project(lngLat).dist(map.project(map.getCenter())) : 0
  const zoom = tree ? map.getZoom() : 12, dz = lngLat && mapReady && !synced() ? Math.abs(zoom - map.getZoom()) : 0
  const duration = Math.min(3000, 600 + 700 * Math.max(Math.log2(1 + px / w) + dz / 4, Math.log2(1 + dy * ppy / w)))
  if (lngLat && mapReady && !synced()) map.flyTo({ center: lngLat, zoom, duration, easing: ease })
  if (!y) return
  const id = ++flight, ppy0 = ppy, start = performance.now()
  const far = keepZoom ? ppy0 : Math.max(60 / (last - first), Math.min(ppy0, 0.6 * w / Math.max(1, dy)))
  const step = now => {
    if (id != flight) return
    const t = Math.min(1, (now - start) / duration)
    ppy = t < 1 ? ppy0 * (far / ppy0) ** Math.sin(Math.PI * t) : ppy0
    sizeTrack()
    scrollWheel((y0 + (y - y0) * ease(t) - first) * ppy)
    if (synced()) syncMap(lng0 + (lng1 - lng0) * ease(t))
    if (t < 1) return requestAnimationFrame(step)
    drawRuler()
    draw()
  }
  requestAnimationFrame(step)
}

// before login: empty map and timeline behind the dimmed password form, the … menu above it
drawMenu()
min = 1500
buildWheel()
setYear(new Date().getFullYear())
</script>
